services:
  postgres:
    image: postgres:16

    container_name:
      pipeline-postgres

    environment:
      POSTGRES_USER:
        ${POSTGRES_USER:-pipeline}

      POSTGRES_PASSWORD:
        ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

      POSTGRES_DB:
        ${POSTGRES_DB:-pipeline}

    ports:
      - "4432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: